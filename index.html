<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TILD Alliance Portal - Server 1691</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(184, 134, 11, 0.14), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(30, 64, 89, 0.28), transparent 34%),
        linear-gradient(118deg, transparent 0 43%, rgba(212, 175, 55, 0.08) 44%, transparent 45% 61%, rgba(255, 255, 255, 0.035) 62%, transparent 63%),
        linear-gradient(145deg, #05080d, #111827 48%, #071018);
      background-attachment: fixed;
      color: #ffffff;
      padding: 20px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      background:
        linear-gradient(27deg, transparent 46%, rgba(255,255,255,.025) 48%, transparent 50%),
        linear-gradient(153deg, transparent 38%, rgba(212,175,55,.035) 40%, transparent 42%);
    }

    .container {
      position: relative;
      max-width: 850px;
      margin: 0 auto;
      background: linear-gradient(145deg, rgba(17, 24, 39, 0.94), rgba(5, 10, 18, 0.97));
      padding: 38px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255,255,255,.05);
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      box-shadow: 0 0 18px rgba(212,175,55,.55);
    }

    h1, h2, p { text-align: center; }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      color: #e4c766;
      margin-bottom: 5px;
      letter-spacing: 1.8px;
      text-shadow: 0 2px 18px rgba(212, 175, 55, 0.22);
    }

    .emblem {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border: 1px solid #d4af37;
      border-radius: 50%;
      color: #f4dc85;
      background: radial-gradient(circle at 35% 30%, #30394a, #0a0f17 68%);
      box-shadow: 0 0 0 6px rgba(212,175,55,.06), 0 10px 30px rgba(0,0,0,.5);
      font-family: Georgia, serif;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #aeb8c6;
      margin-bottom: 30px;
    }

    .language-box {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
    }

    .language-box summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 116px;
      height: 44px;
      padding: 0 13px;
      border-radius: 22px;
      background: rgba(10, 15, 23, 0.92);
      border: 1px solid #d4af37;
      cursor: pointer;
      font-size: 15px;
      list-style: none;
    }

    .globe-icon { font-size: 20px; }
    .language-arrow { color: #94a3b8; font-size: 12px; }
    .flag-icon {
      width: 22px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.18);
      vertical-align: middle;
    }

    .language-box summary::-webkit-details-marker { display: none; }

    .language-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 235px;
      max-height: 360px;
      overflow-y: auto;
      padding: 8px;
      border-radius: 12px;
      background: #0b111b;
      border: 1px solid rgba(212,175,55,.35);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .language-option {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }

    .language-option:hover { background: rgba(212,175,55,.13); }

    @media (max-width: 600px) {
      .container { padding-top: 72px; }
      .language-menu { width: 210px; }
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 28px;
      border-radius: 16px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.055);
    }

    h2 {
      margin-top: 0;
      color: #f1d978;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: .5px;
    }

    label {
      font-weight: bold;
      color: #e8e2d2;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a3443;
      background: rgba(5, 10, 18, .86);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, transform .2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,.12);
      transform: translateY(-1px);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit-btn {
      background: linear-gradient(135deg, #f0d879, #b88a19);
      color: #171007;
      border: none;
      padding: 14px 22px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: .4px;
      box-shadow: 0 8px 24px rgba(184,138,25,.22);
      transition: transform .2s, box-shadow .2s, filter .2s;
    }

    .submit-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(184,138,25,.32);
    }

    small { color: #cbd5e1; }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #9b8a58;
      letter-spacing: .7px;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .container { padding: 72px 18px 24px; }
      form { padding: 20px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emblem">TILD</div>
    <h1>TILD Alliance Portal</h1>
    <p class="subtitle" data-i18n="subtitle">Server 1691 • Built on Respect. United by Strength.</p>

    <details class="language-box" id="languagePicker">
      <summary aria-label="Choose Language" title="Choose Language">
        <span class="globe-icon">🌐</span>
        <span id="currentLanguage"><img class="flag-icon" src="https://flagcdn.com/w40/gb.png" alt=""> English</span>
        <span class="language-arrow">▼</span>
      </summary>
      <div class="language-menu">
        <button type="button" class="language-option" data-language="en"><img class="flag-icon" src="https://flagcdn.com/w40/gb.png" alt=""> English</button>
        <button type="button" class="language-option" data-language="pt-BR"><img class="flag-icon" src="https://flagcdn.com/w40/br.png" alt=""> Português — Brasil</button>
        <button type="button" class="language-option" data-language="ja"><img class="flag-icon" src="https://flagcdn.com/w40/jp.png" alt=""> 日本語</button>
        <button type="button" class="language-option" data-language="zh"><img class="flag-icon" src="https://flagcdn.com/w40/cn.png" alt=""> 中文</button>
        <button type="button" class="language-option" data-language="tr"><img class="flag-icon" src="https://flagcdn.com/w40/tr.png" alt=""> Türkçe</button>
        <button type="button" class="language-option" data-language="ar"><img class="flag-icon" src="https://flagcdn.com/w40/sa.png" alt=""> العربية</button>
        <button type="button" class="language-option" data-language="vi"><img class="flag-icon" src="https://flagcdn.com/w40/vn.png" alt=""> Tiếng Việt</button>
        <button type="button" class="language-option" data-language="fr"><img class="flag-icon" src="https://flagcdn.com/w40/fr.png" alt=""> Français</button>
        <button type="button" class="language-option" data-language="de"><img class="flag-icon" src="https://flagcdn.com/w40/de.png" alt=""> Deutsch</button>
        <button type="button" class="language-option" data-language="nl-BE"><img class="flag-icon" src="https://flagcdn.com/w40/be.png" alt=""> Nederlands — België</button>
        <button type="button" class="language-option" data-language="id"><img class="flag-icon" src="https://flagcdn.com/w40/id.png" alt=""> Bahasa Indonesia</button>
        <button type="button" class="language-option" data-language="lt"><img class="flag-icon" src="https://flagcdn.com/w40/lt.png" alt=""> Lietuvių — Vilnius</button>
        <button type="button" class="language-option" data-language="es"><img class="flag-icon" src="https://flagcdn.com/w40/es.png" alt=""> Español</button>
        <button type="button" class="language-option" data-language="th"><img class="flag-icon" src="https://flagcdn.com/w40/th.png" alt=""> ไทย</button>
      </div>
    </details>

    <form action="https://formspree.io/f/xredjrjp" method="POST">
      <input type="hidden" name="Request Type" value="Monthly Member Data Update">

      <h2 data-i18n="formTitle">Monthly Member Data Update</h2>

      <label data-i18n="playerName">Current Player Name</label>
      <input type="text" name="Current Player Name" required>

      <label data-i18n="verificationCode">Verification Code</label>
      <input type="text" name="Verification Code" required>
      <small data-i18n="verificationHelp">Use your personal verification code provided by alliance leadership. Do not share it with other members.</small>

      <label data-i18n="squadType">First Squad Type</label>
      <select name="First Squad Type" required>
        <option value="" data-i18n="selectType">Select Type</option>
        <option value="Air" data-i18n="air">Air</option>
        <option value="Tank" data-i18n="tank">Tank</option>
        <option value="Missile" data-i18n="missile">Missile</option>
      </select>

      <label data-i18n="countryTimeZone">Country / Time Zone</label>
      <input type="text" name="Country / Time Zone" required>

      <label data-i18n="activeTime">Usual Active Time (Server Time)</label>
      <input type="text" name="Active Time" required placeholder="18:00 - 23:00">

      <label data-i18n="notes">Additional Notes</label>
      <textarea name="Additional Notes"></textarea>

      <button class="submit-btn" type="submit" data-i18n="submit">Submit Update</button>
    </form>

    <div class="footer">TILD Alliance • Server 1691</div>
  </div>

  <script>
    const translations = {
      en: ["Server 1691 • Built on Respect. United by Strength.", "Choose Language", "Monthly Member Data Update", "Current Player Name", "Verification Code", "Use your personal verification code provided by alliance leadership. Do not share it with other members.", "First Squad Type", "Select Type", "Air", "Tank", "Missile", "Country / Time Zone", "Usual Active Time (Server Time)", "Additional Notes", "Submit Update"],
      "pt-BR": ["Servidor 1691 — Construído com respeito. Unidos pela força.", "Escolha o idioma", "Atualização mensal dos dados do membro", "Nome atual do jogador", "Código de verificação", "Use o código pessoal fornecido pela liderança da aliança. Não o compartilhe com outros membros.", "Tipo da primeira equipe", "Selecione o tipo", "Aéreo", "Tanque", "Míssil", "País / Fuso horário", "Horário habitual de atividade (horário do servidor)", "Observações adicionais", "Enviar atualização"],
      ja: ["サーバー1691 — 敬意を礎に、力で団結。", "言語を選択", "メンバーデータ月次更新", "現在のプレイヤー名", "確認コード", "同盟リーダーから提供された個人確認コードを使用してください。他のメンバーと共有しないでください。", "第1部隊タイプ", "タイプを選択", "航空", "戦車", "ミサイル", "国 / タイムゾーン", "通常の活動時間（サーバー時間）", "追加メモ", "更新を送信"],
      zh: ["服务器 1691 • 以尊重为本，以力量团结。", "选择语言", "成员资料月度更新", "当前玩家名称", "验证码", "请使用联盟管理层提供的个人验证码，不要与其他成员分享。", "第一编队类型", "选择类型", "空军", "坦克", "导弹", "国家 / 时区", "常用活跃时间（服务器时间）", "附加说明", "提交更新"],
      tr: ["Sunucu 1691 — Saygı üzerine kuruldu. Güçle birleşti.", "Dil seçin", "Aylık üye bilgisi güncellemesi", "Mevcut oyuncu adı", "Doğrulama kodu", "İttifak yönetimi tarafından verilen kişisel doğrulama kodunuzu kullanın. Başka üyelerle paylaşmayın.", "Birinci takım türü", "Tür seçin", "Hava", "Tank", "Füze", "Ülke / Saat dilimi", "Genel aktiflik saati (sunucu saati)", "Ek notlar", "Güncellemeyi gönder"],
      ar: ["السيرفر 1691 • بُني على الاحترام، واتحد بالقوة.", "اختر اللغة", "التحديث الشهري لبيانات العضو", "اسم اللاعب الحالي", "رمز التحقق", "استخدم رمز التحقق الشخصي المقدم من قيادة التحالف، ولا تشاركه مع الأعضاء الآخرين.", "نوع الفريق الأول", "اختر النوع", "جوي", "دبابات", "صواريخ", "الدولة / المنطقة الزمنية", "وقت النشاط المعتاد (بتوقيت السيرفر)", "ملاحظات إضافية", "إرسال التحديث"],
      vi: ["Máy chủ 1691 — Xây dựng trên sự tôn trọng. Đoàn kết bằng sức mạnh.", "Chọn ngôn ngữ", "Cập nhật dữ liệu thành viên hàng tháng", "Tên người chơi hiện tại", "Mã xác minh", "Sử dụng mã xác minh cá nhân do lãnh đạo liên minh cung cấp. Không chia sẻ với thành viên khác.", "Loại đội hình đầu tiên", "Chọn loại", "Không quân", "Xe tăng", "Tên lửa", "Quốc gia / Múi giờ", "Thời gian hoạt động thường lệ (giờ máy chủ)", "Ghi chú thêm", "Gửi cập nhật"],
      fr: ["Serveur 1691 — Fondé sur le respect. Unis par la force.", "Choisir la langue", "Mise à jour mensuelle des données du membre", "Nom actuel du joueur", "Code de vérification", "Utilisez votre code personnel fourni par la direction de l’alliance. Ne le partagez pas avec les autres membres.", "Type de première escouade", "Sélectionner le type", "Aérien", "Char", "Missile", "Pays / Fuseau horaire", "Heure d’activité habituelle (heure du serveur)", "Notes supplémentaires", "Envoyer la mise à jour"],
      de: ["Server 1691 — Auf Respekt aufgebaut. Durch Stärke vereint.", "Sprache wählen", "Monatliche Aktualisierung der Mitgliedsdaten", "Aktueller Spielername", "Bestätigungscode", "Verwende deinen persönlichen Bestätigungscode von der Allianzleitung. Teile ihn nicht mit anderen Mitgliedern.", "Typ des ersten Trupps", "Typ auswählen", "Luft", "Panzer", "Rakete", "Land / Zeitzone", "Übliche aktive Zeit (Serverzeit)", "Zusätzliche Hinweise", "Aktualisierung senden"],
      "nl-BE": ["Server 1691 — Gebouwd op respect. Verenigd door kracht.", "Kies taal", "Maandelijkse update van ledengegevens", "Huidige spelersnaam", "Verificatiecode", "Gebruik je persoonlijke verificatiecode van de alliantie-leiding. Deel deze niet met andere leden.", "Type eerste team", "Selecteer type", "Lucht", "Tank", "Raket", "Land / Tijdzone", "Gebruikelijke actieve tijd (servertijd)", "Aanvullende opmerkingen", "Update verzenden"],
      id: ["Server 1691 — Dibangun atas rasa hormat. Bersatu oleh kekuatan.", "Pilih bahasa", "Pembaruan data anggota bulanan", "Nama pemain saat ini", "Kode verifikasi", "Gunakan kode verifikasi pribadi yang diberikan pimpinan aliansi. Jangan bagikan kepada anggota lain.", "Jenis skuad pertama", "Pilih jenis", "Udara", "Tank", "Rudal", "Negara / Zona waktu", "Waktu aktif biasa (waktu server)", "Catatan tambahan", "Kirim pembaruan"],
      lt: ["Serveris 1691 — Sukurtas pagarba. Suvienytas jėgos.", "Pasirinkite kalbą", "Mėnesinis nario duomenų atnaujinimas", "Dabartinis žaidėjo vardas", "Patvirtinimo kodas", "Naudokite asmeninį patvirtinimo kodą, kurį suteikė aljanso vadovybė. Nesidalykite juo su kitais nariais.", "Pirmosios komandos tipas", "Pasirinkite tipą", "Oro", "Tankų", "Raketų", "Šalis / Laiko juosta", "Įprastas aktyvumo laikas (serverio laiku)", "Papildomos pastabos", "Siųsti atnaujinimą"],
      es: ["Servidor 1691 — Construido sobre el respeto. Unidos por la fuerza.", "Elegir idioma", "Actualización mensual de datos del miembro", "Nombre actual del jugador", "Código de verificación", "Usa el código personal proporcionado por el liderazgo de la alianza. No lo compartas con otros miembros.", "Tipo del primer escuadrón", "Seleccionar tipo", "Aéreo", "Tanque", "Misil", "País / Zona horaria", "Horario habitual de actividad (hora del servidor)", "Notas adicionales", "Enviar actualización"],
      th: ["เซิร์ฟเวอร์ 1691 — สร้างขึ้นด้วยความเคารพ รวมเป็นหนึ่งด้วยพลัง", "เลือกภาษา", "อัปเดตข้อมูลสมาชิกรายเดือน", "ชื่อผู้เล่นปัจจุบัน", "รหัสยืนยัน", "ใช้รหัสยืนยันส่วนตัวที่ได้รับจากผู้นำพันธมิตร และห้ามแชร์กับสมาชิกคนอื่น", "ประเภททีมแรก", "เลือกประเภท", "อากาศ", "รถถัง", "ขีปนาวุธ", "ประเทศ / เขตเวลา", "ช่วงเวลาที่ใช้งานเป็นประจำ (เวลาเซิร์ฟเวอร์)", "หมายเหตุเพิ่มเติม", "ส่งข้อมูลอัปเดต"]
    };

    const keys = ["subtitle", "languageLabel", "formTitle", "playerName", "verificationCode", "verificationHelp", "squadType", "selectType", "air", "tank", "missile", "countryTimeZone", "activeTime", "notes", "submit"];
    const languagePicker = document.getElementById("languagePicker");
    const currentLanguage = document.getElementById("currentLanguage");
    const languageNames = {
      en: ["gb", "English"], "pt-BR": ["br", "Português"], ja: ["jp", "日本語"],
      zh: ["cn", "中文"], tr: ["tr", "Türkçe"], ar: ["sa", "العربية"],
      vi: ["vn", "Tiếng Việt"], fr: ["fr", "Français"], de: ["de", "Deutsch"],
      "nl-BE": ["be", "Nederlands"], id: ["id", "Indonesia"], lt: ["lt", "Lietuvių"],
      es: ["es", "Español"], th: ["th", "ไทย"]
    };

    function changeLanguage(language) {
      const words = translations[language] || translations.en;
      keys.forEach((key, index) => {
        document.querySelectorAll(`[data-i18n="${key}"]`).forEach(element => {
          element.textContent = words[index];
        });
      });

      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      const selectedLanguage = languageNames[language] || languageNames.en;
      currentLanguage.innerHTML = `<img class="flag-icon" src="https://flagcdn.com/w40/${selectedLanguage[0]}.png" alt=""> ${selectedLanguage[1]}`;
      localStorage.setItem("tildLanguage", language);
    }

    document.querySelectorAll(".language-option").forEach(button => {
      button.addEventListener("click", () => {
        changeLanguage(button.dataset.language);
        languagePicker.open = false;
      });
    });

    const savedLanguage = localStorage.getItem("tildLanguage");
    if (savedLanguage && translations[savedLanguage]) {
      changeLanguage(savedLanguage);
    }
  </script>

</body>
</html>
